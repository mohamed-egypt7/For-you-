<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: radial-gradient(circle at center, #161b22 0%, #0b0f14 100%);
            color: #ffffff;
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: #171b23;
            border-radius: 24px;
            padding: 35px 24px;
            width: 100%;
            max-width: 410px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), 0 0 20px rgba(176, 38, 255, 0.1);
            text-align: center;
            border: 1px solid #30363d;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .heart-box {
            background: linear-gradient(135deg, #b026ff 0%, #ff1a8b 100%);
            width: 80px;
            height: 80px;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 22px;
            font-size: 36px;
            box-shadow: 0 10px 25px rgba(255, 26, 139, 0.4);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 26, 139, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(176, 38, 255, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 26, 139, 0.4); }
        }

        h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        h2 span#recipientName {
            color: #ff4d85;
            text-shadow: 0 0 10px rgba(255, 77, 133, 0.3);
        }

        .subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input[type="password"] {
            width: 100%;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 15px;
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="password"]:focus {
            border-color: #ff4d85;
            box-shadow: 0 0 12px rgba(255, 77, 133, 0.3);
        }

        .btn {
            background: linear-gradient(270deg, #b026ff 0%, #ff1a8b 100%);
            color: #ffffff;
            border: none;
            border-radius: 16px;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(176, 38, 255, 0.4);
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover { opacity: 0.95; transform: translateY(-2px); }
        .btn:active { transform: scale(0.98); }

        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
        }

        .quote-box {
            background-color: #21262d;
            border-radius: 18px;
            padding: 24px 20px;
            position: relative;
            margin-bottom: 22px;
            text-align: right;
            border: 1px solid #30363d;
        }

        .quote-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.7;
            color: #e6edf3;
        }

        .quote-mark-right {
            position: absolute;
            top: 10px;
            right: 14px;
            color: rgba(255, 77, 133, 0.2);
            font-size: 22px;
        }

        .quote-mark-left {
            position: absolute;
            bottom: 10px;
            left: 14px;
            color: rgba(255, 77, 133, 0.2);
            font-size: 22px;
        }

        .music-player {
            background-color: #21262d;
            border-radius: 18px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            border: 1px solid #30363d;
        }

        .play-btn {
            background: linear-gradient(135deg, #ff3366, #ff1a8b);
            color: #ffffff;
            border: none;
            border-radius: 22px;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 51, 102, 0.3);
        }

        .music-info {
            text-align: right;
            flex-grow: 1;
            margin-right: 15px;
        }

        .music-info .title {
            font-weight: 700;
            font-size: 14px;
            margin: 0 0 3px 0;
            color: #ffffff;
        }

        .music-info .desc {
            color: #8b949e;
            font-size: 12px;
            margin: 0;
        }

        .music-icon-box {
            background-color: rgba(255, 255, 255, 0.05);
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff4d85;
            font-size: 18px;
        }

        .reply-section { text-align: right; }
        .reply-section label {
            font-size: 13px;
            color: #8b949e;
            display: block;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 15px;
            color: #ffffff;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            height: 90px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus { border-color: #b026ff; }
    </style>
</head>
<body>

    <div class="card" id="mainContainer">
        <!-- الشاشة الأولى: طلب كلمة المرور بالتعديل اللفظي المطلوب -->
        <div id="loginView">
            <div class="heart-box">
                <i class="fa-solid fa-heart" style="color: white;"></i>
            </div>
            <h2>رسالة خاصة 💌</h2>
            <p class="subtitle" id="lockSubtitle">اكتب الباسورد علشان تقرأ الرسالة يا سارة</p>
            <input type="password" id="passInput" placeholder="اكتب الباسورد هنا..." onkeypress="if(event.key==='Enter') verifyPassword();">
            <button class="btn" onclick="verifyPassword()">
                <i class="fa-solid fa-envelope-open"></i> فتح الرسالة
            </button>
            <div id="errorMsg" class="error"></div>
        </div>
    </div>

    <script>
        let dbData = {};
        let currentSlug = "";

        function getSlug() {
            const urlParams = new URLSearchParams(window.location.search);
            let slug = urlParams.get('to');
            if (!slug && window.location.hash) {
                slug = decodeURIComponent(window.location.hash.substring(1));
            }
            return slug || "first";
        }

        currentSlug = getSlug();

        async function fetchDatabase() {
            try {
                const res = await fetch('db.json?t=' + Date.now());
                if (res.ok) {
                    dbData = await res.json();
                    if (dbData[currentSlug] && dbData[currentSlug].name) {
                        const targetName = dbData[currentSlug].name;
                        document.getElementById('lockSubtitle').innerText = `اكتب الباسورد علشان تقرأ الرسالة يا ${targetName}`;
                    }
                }
            } catch (e) {
                console.log("خطأ في الاتصال بقاعدة البيانات:", e);
            }
        }

        fetchDatabase();

        async function verifyPassword() {
            const passInput = document.getElementById('passInput');
            const errorDiv = document.getElementById('errorMsg');
            const enteredPass = passInput.value.trim();

            if (!enteredPass) {
                errorDiv.innerText = 'يرجى كتابة الباسورد أولاً!';
                return;
            }

            errorDiv.innerText = 'جاري التحقق...';

            if (Object.keys(dbData).length === 0) {
                await fetchDatabase();
            }

            const userInfo = dbData[currentSlug];
            let correctPass = userInfo ? (userInfo.password ? userInfo.password.toString().trim() : "1234") : "1234";

            if (enteredPass === correctPass) {
                showContent(userInfo);
            } else {
                errorDiv.innerText = 'كلمة المرور غير صحيحة، حاول مرة أخرى.';
            }
        }

        function showContent(userInfo) {
            const recipientName = userInfo ? (userInfo.name || currentSlug) : currentSlug;
            const messageText = userInfo ? (userInfo.message || "أهلاً بك! تم إنهاء تجهيز هذه الرسالة الخاصة لك.") : "أهلاً بك! تم إنهاء تجهيز هذه الرسالة الخاصة لك.";
            const songUrl = (userInfo && userInfo.song_link && userInfo.song_link.startsWith('http')) 
                            ? userInfo.song_link 
                            : "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";

            document.getElementById('mainContainer').innerHTML = `
                <div class="heart-box">
                    <i class="fa-solid fa-heart" style="color: white;"></i>
                </div>
                <h2>رسالة إلى: <span id="recipientName">${recipientName}</span></h2>
                <p class="subtitle">رسالة سرية مخصصة</p>

                <div class="quote-box">
                    <i class="fa-solid fa-quote-right quote-mark-right"></i>
                    <p>${messageText}</p>
                    <i class="fa-solid fa-quote-left quote-mark-left"></i>
                </div>

                <audio id="bgAudio" src="${songUrl}" loop></audio>
                
                <div class="music-player">
                    <button class="play-btn" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i> تشغيل</button>
                    <div class="music-info">
                        <p class="title">مقطوعة هادئة</p>
                        <p class="desc">موسيقى استرخاء</p>
                    </div>
                    <div class="music-icon-box">
                        <i class="fa-solid fa-music"></i>
                    </div>
                </div>

                <div class="reply-section">
                    <label>رد على المرسل (بشكل مجهول):</label>
                    <textarea id="replyMsg" placeholder="اكتب ردك هنا..."></textarea>
                    <button class="btn" onclick="sendReply('${recipientName}')">
                        <i class="fa-solid fa-paper-plane"></i> إرسال الرد سراً
                    </button>
                </div>
            `;
        }

        function togglePlay() {
            const audio = document.getElementById('bgAudio');
            const playBtn = document.getElementById('playBtn');
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i> إيقاف';
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i> تشغيل';
            }
        }

        const botToken = '8882621676:AAFNQ0B3q6rPSMTIujyIHGYiep9xNM1rgZU';
        const chatId = '8718173410';

        function sendReply(name) {
            const message = document.getElementById('replyMsg').value.trim();
            if (!message) {
                alert('الرجاء كتابة رد أولاً!');
                return;
            }

            const textToTelegram = `💌 رد جديد من (${name}):\n\n${message}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: textToTelegram })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    alert('تم إرسال الرد سراً بنجاح! شكراً لك.');
                    document.getElementById('replyMsg').value = '';
                } else {
                    alert('حدث خطأ أثناء الإرسال.');
                }
            })
            .catch(() => alert('تأكد من اتصالك بالإنترنت.'));
        }
    </script>
</body>
</html>
