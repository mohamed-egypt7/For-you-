        body {

        .card {

            border: 1px solid #21262d;
        }

            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 34px;

        input[type="password"] {

            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 14px;
            color: #ffffff;
            font-family: inherit;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            border-color: #ff4d85;
        }
        .btn {
            background: linear-gradient(270deg, #b026ff 0%, #ff1a8b 100%);

            border: none;
            border-radius: 14px;
            width: 100%;
            padding: 14px;
            font-size: 16px;

            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(176, 38, 255, 0.3);
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.92; }
        .error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: 12px;
        }
