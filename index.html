<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة ومجهولة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #070913; color: white; min-height: 100vh; overflow-x: hidden; position: relative; }
        .bg-glow { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 700px; height: 700px; background: radial-gradient(circle, rgba(236, 72, 153, 0.18) 0%, rgba(139, 92, 246, 0.08) 50%, transparent 80%); z-index: -1; animation: pulseGlow 6s ease-in-out infinite alternate; }
        @keyframes pulseGlow { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; } }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 36px; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6); animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(25px) scale(0.95); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .float-heart { animation: floating 3s ease-in-out infinite; }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        #toast { position: fixed; top: -120px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; padding: 16px 32px; border-radius: 50px; font-weight: 700; box-shadow: 0 20px 40px rgba(236, 72, 153, 0.4); transition: top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; }
        .show-toast { top: 30px !important; }
        .hidden-section { display: none; }
        .typing-cursor::after { content: '|'; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="bg-glow"></div>
    <div id="toast">تم الإرسال بنجاح!</div>

    <!-- 1. شاشة القفل والباسورد -->
    <div id="password-screen" class="glass-panel w-full max-w-md p-8 text-center my-8">
        <div class="w-24 h-24 bg-gradient-to-tr from-pink-500 to-violet-600 rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-2xl shadow-pink-500/40 float-heart">
            <i class="fas fa-lock text-4xl text-white"></i>
        </div>
        <h1 class="text-2xl font-extrabold mb-2 tracking-wide text-pink-400">رسالة سرية ومخصصة</h1>
        <p class="text-xs text-gray-400 mb-6">أدخل كلمة المرور الخاصة لفتح رسالتك الاستثنائية</p>
        
        <div class="space-y-4">
            <input type="password" id="page-password-input" placeholder="اكتب كلمة المرور هنا..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-4 text-sm text-white text-center placeholder-gray-500 focus:outline-none focus:border-pink-500 font-mono transition">
            <button onclick="unlockPage()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 active:scale-95 text-white font-bold py-4 rounded-2xl transition shadow-lg shadow-pink-600/40 text-sm flex items-center justify-center gap-2">
                <i class="fas fa-key"></i> فتح الرسالة الآن
            </button>
        </div>
    </div>

    <!-- 2. محتوى الرسالة -->
    <div id="content-screen" class="hidden-section glass-panel w-full max-w-md p-8 text-center my-8">
        <div class="w-24 h-24 bg-gradient-to-tr from-pink-500 to-violet-600 rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-2xl shadow-pink-500/40 float-heart">
            <i class="fas fa-heart text-4xl text-white"></i>
        </div>

        <h1 id="recipient-title" class="text-2xl font-extrabold mb-2 tracking-wide text-pink-400">رسالة مجهولة لك</h1>
        <p id="recipient-subtitle" class="text-xs text-gray-400 mb-6">هناك شخص يود إخبارك بشيء مميز...</p>

        <div class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 text-right relative overflow-hidden">
            <div class="absolute top-2 left-3 text-pink-500/20 text-6xl font-serif">“</div>
            <p id="main-message" class="text-sm text-gray-200 leading-relaxed relative z-10 whitespace-pre-line min-h-[90px]"></p>
            <div class="absolute bottom-1 right-3 text-pink-500/20 text-6xl font-serif">”</div>
        </div>

        <div class="mb-6 p-4 bg-white/5 rounded-2xl border border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-3.5">
                <div class="w-12 h-12 bg-pink-500/20 rounded-2xl flex items-center justify-center text-pink-400 shadow-inner">
                    <i class="fas fa-music text-lg" id="music-symbol"></i>
                </div>
                <div class="text-right">
                    <p id="song-title-display" class="text-xs font-bold text-white">مقطوعة هادئة</p>
                    <p id="song-desc-display" class="text-[10px] text-gray-400">اضغط للاستماع أثناء القراءة</p>
                </div>
            </div>
            <button onclick="toggleMusic()" id="music-btn" class="bg-pink-600 hover:bg-pink-700 active:scale-95 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-pink-600/30">
                <i class="fas fa-play" id="music-icon"></i> <span id="music-text">تشغيل</span>
            </button>
        </div>

        <div class="space-y-3 text-right">
            <label class="block text-xs text-gray-300 font-semibold">رد على المرسل (بشكل مجهول):</label>
            <textarea id="anonymous-reply" rows="3" placeholder="اكتب ردك هنا..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 transition resize-none"></textarea>
            <button onclick="sendReply()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 active:scale-95 text-white font-bold py-4 rounded-2xl transition shadow-lg shadow-pink-600/30 text-sm flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i> إرسال الرد سراً
            </button>
        </div>
    </div>

    <audio id="bg-music" loop></audio>

    <script>
        let currentSlug = '';
        let pageData = null;

        const defaultPages = {
            "demo": {
                name: "أحمد أو سارة",
                message: "أحياناً الشخص البسيط في حياتنا بيترك أثر كبير جداً.. شكراً لكونك شخص لطيف ومميز دائماً ✨",
                subtitle: "رسالة خاصة تم اختيارها لك بعناية",
                password: "123",
                songTitle: "مقطوعة رومانسية",
                songDesc: "موسيقى هادئة مميزة",
                songUrl: "https://actions.google.com/sounds/v1/ambiences/relaxing_music.ogg"
            }
        };

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            currentSlug = urlParams.get('to') || 'demo';

            // بيانات افتراضية تجريبية لو الـ LocalStorage فاضي عشان مديش 404
            let db = JSON.parse(localStorage.getItem('secret_pages_db')) || defaultPages;
            
            // لو الصفحة مش موجودة في الذاكرة المؤقتة، بنديله صفحة افتراضية عشان يفتح وما يطلعش خطأ
            if (!db[currentSlug]) {
                db[currentSlug] = {
                    name: currentSlug,
                    message: "أهلاً بك! تم إنهاء تجهيز هذه الرسالة الخاصة لك بناءً على طلب شخص يود إسعادك.",
                    subtitle: "رسالة سرية مخصصة",
                    password: "123",
                    songTitle: "مقطوعة هادئة",
                    songDesc: "موسيقى استرخاء",
                    songUrl: "https://actions.google.com/sounds/v1/ambiences/relaxing_music.ogg"
                };
            }

            pageData = db[currentSlug];
        };

        function unlockPage() {
            const enteredPass = document.getElementById('page-password-input').value.trim();
            if (!pageData) return;

            if (enteredPass === pageData.password) {
                document.getElementById('password-screen').classList.add('hidden-section');
                document.getElementById('content-screen').classList.remove('hidden-section');

                document.getElementById('recipient-title').innerText = `رسالة إلى: ${pageData.name}`;
                document.getElementById('recipient-subtitle').innerText = pageData.subtitle || "هناك شخص يود إخبارك بشيء مميز...";
                
                if (pageData.songTitle) document.getElementById('song-title-display').innerText = pageData.songTitle;
                if (pageData.songDesc) document.getElementById('song-desc-display').innerText = pageData.songDesc;
                
                const audio = document.getElementById('bg-music');
                audio.src = pageData.songUrl || "https://actions.google.com/sounds/v1/ambiences/relaxing_music.ogg";

                typeWriterEffect(pageData.message);
            } else {
                showToast("كلمة المرور غير صحيحة!");
            }
        }

        function typeWriterEffect(text) {
            const container = document.getElementById('main-message');
            container.innerHTML = '';
            container.classList.add('typing-cursor');
            let i = 0;
            const speed = 35;

            function typing() {
                if (i < text.length) {
                    if (text.charAt(i) === '\n') {
                        container.innerHTML += '<br>';
                    } else {
                        container.innerHTML += text.charAt(i);
                    }
                    i++;
                    setTimeout(typing, speed);
                } else {
                    container.classList.remove('typing-cursor');
                }
            }
            typing();
        }

        let isPlaying = false;
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const icon = document.getElementById('music-icon');
            const text = document.getElementById('music-text');
            const symbol = document.getElementById('music-symbol');
            
            if (!isPlaying) {
                music.play().catch(e => alert("تأكد أن رابط الأغنية مباشر بصيغة MP3"));
                isPlaying = true;
                icon.className = "fas fa-pause";
                text.innerText = "إيقاف";
                symbol.classList.add('animate-spin');
            } else {
                music.pause();
                isPlaying = false;
                icon.className = "fas fa-play";
                text.innerText = "تشغيل";
                symbol.classList.remove('animate-spin');
            }
        }

        const BOT_TOKEN = "8891748364:AAGHnBFyQfivzTJurW-Hnz7ndvq5FM2J7p8";
        const CHAT_ID = "8557873303";

        async function sendReply() {
            const replyText = document.getElementById('anonymous-reply').value.trim();
            if (!replyTest) {
                showToast("يرجى كتابة رد أولاً!");
                return;
            }

            showToast("جاري إرسال الرد سراً...");

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: `💌 [رد مجهول جديد على صفحة: ${currentSlug}]\n\n📝 الرد:\n${replyText}`
                    })
                });
                showToast("تم إرسال ردك بنجاح وبسرية تامة!");
                document.getElementById('anonymous-reply').value = '';
            } catch(e) {
                showToast("حدث خطأ في الإرسال.");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show-toast');
            setTimeout(() => { toast.classList.remove('show-toast'); }, 3000);
        }
    </script>
</body>
</html>
