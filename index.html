<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة ومجهولة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0b0f19; color: white; min-height: 100vh; overflow-x: hidden; position: relative; }
        .bg-glow { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 80%); z-index: -1; animation: pulseGlow 7s ease-in-out infinite alternate; }
        @keyframes pulseGlow { 0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 32px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(20px) scale(0.97); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        .float-heart { animation: floating 3s ease-in-out infinite; }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        #toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ec4899, #8b5cf6); color: white; padding: 14px 28px; border-radius: 50px; font-weight: 700; box-shadow: 0 15px 30px rgba(236, 72, 153, 0.4); transition: top 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000; }
        .show-toast { top: 25px !important; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="bg-glow"></div>
    <div id="toast">تم الإرسال بنجاح!</div>

    <div class="glass-panel w-full max-w-md p-8 text-center my-8">
        <!-- أيقونة القلب العائمة -->
        <div class="w-20 h-20 bg-gradient-to-tr from-pink-500 to-violet-600 rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-xl shadow-pink-500/30 float-heart">
            <i class="fas fa-heart text-3xl text-white"></i>
        </div>

        <h1 id="recipient-title" class="text-2xl font-extrabold mb-2 tracking-wide text-pink-400">رسالة مجهولة لك</h1>
        <p id="recipient-subtitle" class="text-xs text-gray-400 mb-6">هناك شخص يود إخبارك بشيء مميز...</p>

 صندوق الرسالة -->
        <div class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-6 text-right relative overflow-hidden">
            <div class="absolute top-2 left-3 text-pink-500/20 text-5xl font-serif">“</div>
            <p id="main-message" class="text-sm text-gray-200 leading-relaxed relative z-10 whitespace-pre-line">
                جاري تحميل الرسالة...
            </p>
            <div class="absolute bottom-1 right-3 text-pink-500/20 text-5xl font-serif">”</div>
        </div>

        <!-- مشغل الموسيقى الرومانسية الهادئة -->
        <div class="mb-6 p-3 bg-white/5 rounded-2xl border border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-pink-500/20 rounded-xl flex items-center justify-center text-pink-400">
                    <i class="fas fa-music animate-spin"></i>
                </div>
                <div class="text-right">
                    <p class="text-xs font-bold text-white">مقطوعة هادئة</p>
                    <p class="text-[10px] text-gray-400">اضغط للاستماع أثناء القراءة</p>
                </div>
            </div>
            <button onclick="toggleMusic()" id="music-btn" class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-md">
                <i class="fas fa-play" id="music-icon"></i> <span id="music-text">تشغيل</span>
            </button>
        </div>

        <!-- صندوق الرد المجهول -->
        <div class="space-y-3 text-right">
            <label class="block text-xs text-gray-300 font-semibold">رد على المرسل (بشكل مجهول):</label>
            <textarea id="anonymous-reply" rows="3" placeholder="اكتب ردك هنا..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-pink-500 transition resize-none"></textarea>
            <button onclick="sendReply()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:opacity-90 text-white font-bold py-3.5 rounded-2xl transition shadow-lg shadow-pink-600/30 text-sm flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i> إرسال الرد سراً
            </button>
        </div>

        <div class="mt-6 pt-4 border-t border-white/10 text-center">
            <a href="admin.html" class="text-[11px] text-gray-500 hover:text-gray-300 transition">لوحة تحكم الأدمن (إنشاء رسالة جديدة)</a>
        </div>
    </div>

    <!-- عنصر الصوت (موسيقى هادئة من مصدر مجاني آمن) -->
    <audio id="bg-music" loop src="https://actions.google.com/sounds/v1/ambiences/relaxing_music.ogg"></audio>

    <script>
        // بيانات افتراضية لو لم يتم إدخال شيء
        const defaultPages = {
            "demo": {
                name: "أحمد أو سارة",
                message: "أحياناً الشخص البسيط في حياتنا بيترك أثر كبير جداً.. شكراً لكونك شخص لطيف ومميز دائماً ✨",
                subtitle: "رسالة خاصة تم اختيارها لك بعناية"
            }
        };

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('to') || 'demo';

            // جلب البيانات من التخزين المحلي (LocalStorage) أو البيانات الافتراضية
            let db = JSON.parse(localStorage.getItem('secret_pages_db')) || defaultPages;

            if (db[slug]) {
                document.getElementById('recipient-title').innerText = `رسالة إلى: ${db[slug].name}`;
                document.getElementById('recipient-subtitle').innerText = db[slug].subtitle || "هناك شخص يود إخبارك بشيء مميز...";
                document.getElementById('main-message').innerText = db[slug].message;
            } else {
                document.getElementById('recipient-title').innerText = "عذراً!";
                document.getElementById('main-message').innerText = "هذه الصفحة غير موجودة أو تم حذفها من قبل الأدمن.";
            }
        };

        // تشغيل وإيقاف الموسيقى
        let isPlaying = false;
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const icon = document.getElementById('music-icon');
            const text = document.getElementById('music-text');
            
            if (!isPlaying) {
                music.play();
                isPlaying = true;
                icon.className = "fas fa-pause";
                text.innerText = "إيقاف";
            } else {
                music.pause();
                isPlaying = false;
                icon.className = "fas fa-play";
                text.innerText = "تشغيل";
            }
        }

        // إرسال الرد المجهول لتليجرام (أو حفظه)
        const BOT_TOKEN = "8891748364:AAGHnBFyQfivzTJurW-Hnz7ndvq5FM2J7p8";
        const CHAT_ID = "8557873303";

        async function sendReply() {
            const replyText = document.getElementById('anonymous-reply').value.trim();
            if (!replyText) {
                showToast("يرجى كتابة رد أولاً!");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('to') || 'demo';

            showToast("جاري إرسال الرد سراً...");

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: `💌 [رد مجهول جديد على رسالة: ${slug}]\n\n📝 الرد:\n${replyText}`
                    })
                });
                showToast("تم إرسال ردك بنجاح وبسرية تامة!");
                document.getElementById('anonymous-reply').value = '';
            } catch(e) {
                showToast("حدث خطأ في الإرسال.");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show-toast');
            setTimeout(() => { toast.classList.remove('show-toast'); }, 3000);
        }
    </script>
</body>
</html>
