<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسالة الخاصة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* منع التحديد، النسخ، وتظليل النصوص تماماً لحماية المحتوى والاسكرين */
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #070913; 
            color: white; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
        
        /* تأثير التغبيش الفوري عند محاولة أخذ لقطة شاشة أو مغادرة الصفحة */
        .protected-content {
            transition: filter 0.2s ease-in-out;
        }
        .blurred-screen {
            filter: blur(25px) !important;
            opacity: 0.1;
        }
    </style>
</head>
<body class="w-full max-w-md mx-auto protected-content" id="main-body">

    <!-- شاشة إدخال كلمة المرور -->
    <div id="password-screen" class="glass-panel p-8 w-full text-center space-y-6">
        <div class="w-16 h-16 bg-pink-500/10 border border-pink-500/20 rounded-2xl flex items-center justify-center mx-auto text-pink-400 text-2xl">
            <i class="fas fa-lock"></i>
        </div>
        <div>
            <h1 id="recipient-title" class="text-xl font-bold text-pink-400">هذه الرسالة محمية</h1>
            <p class="text-xs text-gray-400 mt-1">الرجاء إدخال كلمة المرور لعرض الرسالة</p>
        </div>
        <div class="space-y-4">
            <input type="password" id="password-input" placeholder="أدخل كلمة المرور..." class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-center text-white focus:outline-none focus:border-pink-500 font-mono text-lg">
            <button onclick="checkPassword()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold py-4 rounded-xl transition shadow-lg text-sm">
                فتح الرسالة <i class="fas fa-key mr-2"></i>
            </button>
        </div>
    </div>

    <!-- شاشة الرسالة السرية -->
    <div id="message-screen" class="glass-panel p-8 w-full space-y-6 hidden text-right">
        <div class="flex flex-col items-center text-center space-y-3">
            <img id="profile-img" src="" alt="صورة الشخص" class="w-20 h-20 rounded-full object-cover border-2 border-pink-500/50 hidden">
            <h2 id="display-name" class="text-2xl font-bold text-pink-400"></h2>
        </div>

        <div class="bg-white/5 p-5 rounded-2xl border border-white/5 text-gray-200 leading-relaxed text-sm whitespace-pre-wrap" id="display-message"></div>

        <!-- مشغل الأغنية (يشتغل أوتوماتيك) -->
        <audio id="bg-audio" loop></audio>

        <!-- خانة الرد (بدون أي سيرة للبوت) -->
        <div class="space-y-3 pt-4 border-t border-white/10">
            <label class="block text-xs text-pink-300 font-semibold">اكتب رسالتك أو ردك للشخص:</label>
            <textarea id="reply-text" rows="3" placeholder="اكتب ردك هنا..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 resize-none"></textarea>
            <button onclick="sendReply()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition text-sm">
                إرسال إلى الشخص <i class="fas fa-paper-plane mr-2"></i>
            </button>
        </div>
    </div>

    <script>
        let currentSlug = '';
        let pageData = {};

        // توكن البوت والشاد آي دي الخاص بك
        const BOT_TOKEN = '7581177651:AAEUQ_YOUR_BOT_TOKEN_HERE_EXAMPLE'; 
        const CHAT_ID = 'YOUR_CHAT_ID_HERE';       

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            currentSlug = urlParams.get('to');

            const db = JSON.parse(localStorage.getItem('secret_pages_db')) || {};

            if (!currentSlug || !db[currentSlug]) {
                document.getElementById('recipient-title').innerText = "الصفحة غير موجودة";
                document.getElementById('password-input').style.display = 'none';
                return;
            }

            pageData = db[currentSlug];
            document.getElementById('recipient-title').innerText = `الرسالة موجهة إلى: ${pageData.name}`;
        };

        function checkPassword() {
            const inputVal = document.getElementById('password-input').value.trim();
            const correctPass = String(pageData.password || '').trim();

            if (inputVal === correctPass) {
                document.getElementById('password-screen').classList.add('hidden');
                document.getElementById('message-screen').classList.remove('hidden');

                document.getElementById('display-name').innerText = pageData.name;
                document.getElementById('display-message').innerText = pageData.message;

                if (pageData.imageUrl) {
                    const img = document.getElementById('profile-img');
                    img.src = pageData.imageUrl;
                    img.classList.remove('hidden');
                }

                if (pageData.songUrl) {
                    const audio = document.getElementById('bg-audio');
                    audio.src = pageData.songUrl;
                    audio.play().catch(e => console.log("Autoplay blocked", e));
                }
            } else {
                alert("كلمة المرور غير صحيحة، حاول مرة أخرى.");
            }
        }

        // إرسال الرد مع تجاوز قيود متصفحات الموبايل والإعلانات
        function sendReply() {
            const replyContent = document.getElementById('reply-text').value.trim();
            if (!replyContent) {
                alert("يرجى كتابة رسالة أولاً.");
                return;
            }

            // جلب البيانات وإرسالها بطريقة آمنة
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .catch(() => ({}))
                .then(data => {
                    const ip = data.ip || "غير معروف";
                    const location = `${data.city || ''}, ${data.country_name || ''}`.trim() || "غير معروف";
                    const timeNow = new Date().toLocaleString('ar-EG');

                    saveToLocalInbox(replyContent, ip, location, timeNow);

                    const telegramText = `📬 *رسالة جديدة تم استلامها!*\n\n` +
                                         `👤 *الموجه له:* ${pageData.name} (${currentSlug})\n` +
                                         `💬 *الرسالة:* ${replyContent}\n\n` +
                                         `🌐 *الآي بي:* \`${ip}\`\n` +
                                         `📍 *الموقع:* ${location}\n` +
                                         `⏰ *التوقيت:* ${timeNow}`;

                    // استخدام وضع no-cors أو طريقة تتجاوز الحظر البشري للإعلانات
                    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: telegramText,
                            parse_mode: 'Markdown'
                        })
                    }).catch(e => console.log("Telegram error bypassed"));

                    alert("تم إرسال رسالتك بنجاح!");
                    document.getElementById('reply-text').value = '';
                });
        }

        function saveToLocalInbox(text, ip, location, date) {
            let inbox = JSON.parse(localStorage.getItem('secret_inbox_messages')) || [];
            const newMessage = {
                id: Date.now(),
                slug: currentSlug,
                recipientName: pageData.name,
                text: text,
                ip: ip,
                location: location,
                date: date
            };
            inbox.unshift(newMessage);
            localStorage.setItem('secret_inbox_messages', JSON.stringify(inbox));
        }

        // --- نظام حماية متطور ضد الاسكرين شوت والنسخ ---
        // 1. منع كليك يمين
        document.addEventListener('contextmenu', e => e.preventDefault());

        // 2. منع اختصارات لوحة المفاتيح للتفتيش أو الحفظ
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85) || (e.ctrlKey && e.keyCode == 83)) {
                e.preventDefault();
                return false;
            }
        });

        // 3. تغبيش الشاشة فوراً عند محاولة مغادرة التطبيق أو أخذ سكرين شوت (Blur on App Switch)
        window.addEventListener('blur', function() {
            document.getElementById('main-body').classList.add('blurred-screen');
        });
        window.addEventListener('focus', function() {
            document.getElementById('main-body').classList.remove('blurred-screen');
        });
    </script>
</body>
</html>
