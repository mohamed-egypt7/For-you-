<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --box-bg: #21262d;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --pink-accent: #ff4d85;
            --gradient-btn: linear-gradient(270deg, #b026ff, #ff1a8b);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .icon-top {
            background: linear-gradient(135deg, #ff758c 10%, #ff7eb3 100%);
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
        }

        h2 {
            margin: 0;
            font-size: 24px;
            color: var(--pink-accent);
        }

        h2 span {
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        .quote-box {
            background-color: var(--box-bg);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            margin-bottom: 25px;
        }

        .quote-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
        }

        .fa-quote-right, .fa-quote-left {
            color: rgba(255, 77, 133, 0.2);
            font-size: 20px;
            position: absolute;
        }
        
        .fa-quote-right { top: 10px; right: 15px; }
        .fa-quote-left { bottom: 10px; left: 15px; }

        .music-player {
            background-color: var(--box-bg);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .play-btn {
            background-color: var(--pink-accent);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-info {
            text-align: right;
            flex-grow: 1;
            margin-right: 15px;
        }

        .music-info p {
            margin: 0;
        }

        .music-info .title {
            font-weight: bold;
            font-size: 15px;
        }

        .music-info .desc {
            color: var(--text-muted);
            font-size: 12px;
        }

        .music-icon-box {
            background-color: rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--pink-accent);
        }

        .reply-section {
            text-align: right;
        }
