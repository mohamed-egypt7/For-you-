<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رسالة سرية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --box-bg: #21262d;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --pink-accent: #ff4d85;
            --gradient-btn: linear-gradient(270deg, #b026ff, #ff1a8b);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .icon-top {
            background: linear-gradient(135deg, #ff758c 10%, #ff7eb3 100%);
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
        }

        h2 {
            margin: 0;
            font-size: 24px;
            color: var(--pink-accent);
        }

        h2 span {
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 25px;
        }

        .quote-box {
            background-color: var(--box-bg);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            margin-bottom: 25px;
        }

        .quote-box p {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
        }

        .fa-quote-right, .fa-quote-left {
            color: rgba(255, 77, 133, 0.2);
            font-size: 20px;
            position: absolute;
        }
        
        .fa-quote-right { top: 10px; right: 15px; }
        .fa-quote-left { bottom: 10px; left: 15px; }

        .music-player {
            background-color: var(--box-bg);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .play-btn {
            background-color: var(--pink-accent);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-family: inherit;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-info {
            text-align: right;
            flex-grow: 1;
            margin-right: 15px;
        }

        .music-info p {
            margin: 0;
        }

        .music-info .title {
            font-weight: bold;
            font-size: 15px;
        }

        .music-info .desc {
            color: var(--text-muted);
            font-size: 12px;
        }

        .music-icon-box {
            background-color: rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--pink-accent);
        }

        .reply-section {
            text-align: right;
        }

        .reply-section label {
            font-size: 14px;
            color: var(--text-main);
            display: block;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            background-color: var(--box-bg);
            border: 1px solid #30363d;
            border-radius: 15px;
            padding: 15px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            resize: none;
            height: 80px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        
        textarea:focus {
            outline: none;
            border-color: var(--pink-accent);
        }

        .send-btn {
            background: var(--gradient-btn);
            color: white;
            border: none;
            border-radius: 15px;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-top">
            <i class="fa-solid fa-heart" style="color: white;"></i>
        </div>

        <h2 id="page-title">رسالة إلى: <span>تحميل...</span></h2>
        <p class="subtitle">رسالة سرية مخصصة</p>

        <div class="quote-box">
            <i class="fa-solid fa-quote-right"></i>
            <p>أهلاً بك! تم إنهاء تجهيز هذه الرسالة الخاصة لك بناءً على طلب شخص يود إسعادك.</p>
            <i class="fa-solid fa-quote-left"></i>
        </div>

        <div class="music-player">
            <button class="play-btn" id="playBtn"><i class="fa-solid fa-play"></i> تشغيل</button>
            <div class="music-info">
                <p class="title">مقطوعة هادئة</p>
                <p class="desc">موسيقى استرخاء</p>
            </div>
            <div class="music-icon-box">
                <i class="fa-solid fa-music"></i>
            </div>
        </div>

        <div class="reply-section">
            <label>رد على المرسل (بشكل مجهول):</label>
            <textarea id="replyMsg" placeholder="اكتب ردك هنا..."></textarea>
            <button id="submitBtn" class="send-btn">
                <i class="fa-solid fa-paper-plane"></i> إرسال الرد سراً
            </button>
        </div>
    </div>

    <script>
        // قراءة رقم المستخدم أو الـ ID من الرابط (مثلاً ?to=4 أو #4)
        const urlParams = new URLSearchParams(window.location.search);
        let userKey = urlParams.get('to');
        if (!userKey) {
            userKey = window.location.hash.substring(1) || "شخص ما";
        }
        document.getElementById('page-title').innerHTML = `رسالة إلى: <span>${userKey}</span>`;

        // بيانات بوت التليجرام الخاص بك المدمجة تلقائياً
        const botToken = '8882621676:AAFNQ0B3q6rPSMTIujyIHGYiep9xNM1rgZU';
        const chatId = '8718173410';

        document.getElementById('submitBtn').addEventListener('click', function() {
            const message = document.getElementById('replyMsg').value;

            if(message.trim() === '') {
                alert('الرجاء كتابة رد أولاً!');
                return;
            }

            const textToTelegram = `💌 رد جديد من صفحة (${userKey}):\n\n${message}`;
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: textToTelegram
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.ok) {
                    alert('تم إرسال الرد سراً بنجاح! شكراً لك.');
                    document.getElementById('replyMsg').value = '';
                } else {
                    alert('حدث خطأ أثناء الإرسال.');
                }
            })
            .catch(error => {
                alert('تأكد من اتصالك بالإنترنت.');
            });
        });
    </script>

</body>
</html>
