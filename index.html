<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="main-content">
        <h1>أهلاً بك</h1>
        <p>مرحباً بك في موقعي الشخصي.</p>
    </main>

    <!-- زرار فتح الشات العائم -->
    <div id="chat-toggle-btn" class="chat-toggle">💬</div>

    <!-- نافذة الشات التفاعلي المحلية -->
    <div id="chat-box" class="chat-box hidden">
        <div class="chat-header">
            <span>التواصل المباشر</span>
            <button id="close-chat">×</button>
        </div>
        <div id="chat-messages" class="chat-messages">
            <!-- الرسائل تظهر هنا ديناميكياً -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="اكتب إجابتك هنا...">
            <button id="send-btn">إرسال</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
