<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - صفحتك الخاصة</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        h2 { color: #00d2ff; margin-bottom: 15px; }
        p { color: #b2b2b2; margin-bottom: 20px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .error { color: #ff6b6b; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div id="login-box">
            <h2 id="welcome-title">تسجيل الدخول</h2>
            <p>أدخل كلمة المرور الخاصة بك لعرض المحتوى</p>
            <input type="password" id="password-input" placeholder="كلمة المرور">
            <button class="btn" onclick="checkPassword()">دخول</button>
            <div id="error-msg" class="error"></div>
        </div>
    </div>

    <script>
        let userData = null;
        let userName = "";

        async function initPage() {
            userName = window.location.hash.substring(1);
            if (!userName) {
                document.getElementById('app').innerHTML = '<h2 class="error">خطأ</h2><p>لم يتم العثور على اسم المستخدم في الرابط.</p>';
                return;
            }
            
            document.getElementById('welcome-title').innerText = `أهلاً بك، ${userName}`;

            try {
                const res = await fetch('db.json');
                const data = await res.json();
                if (data[userName]) {
                    userData = data[userName];
                } else {
                    document.getElementById('app').innerHTML = '<h2 class="error">غير موجود</h2><p>هذا المستخدم غير مسجل.</p>';
                }
            } catch (e) {
                document.getElementById('app').innerHTML = '<h2 class="error">خطأ</h2><p>تعذر الاتصال بقاعدة البيانات.</p>';
            }
        }

        function checkPassword() {
            const inputVal = document.getElementById('password-input').value.trim();
            const errorDiv = document.getElementById('error-msg');

            if (!userData) return;

            if (inputVal === userData.password) {
                let songUrl = userData.song_link;
                let html = `<h2>مرحباً بك، ${userName}</h2><p>تم تسجيل الدخول بنجاح!</p>`;
                
                if (songUrl && songUrl.startsWith('http')) {
                    html += `<a href="${songUrl}" class="btn" target="_blank" style="margin-top: 20px; display:inline-block; text-align:center;">🎵 اضغط هنا لفتح الأغنية</a>`;
                } else {
                    html += `<p style="color: #888;">لا توجد أغاني أو روابط مضافة لهذا الحساب حالياً.</p>`;
                }
                document.getElementById('app').innerHTML = html;
            } else {
                errorDiv.innerText = 'كلمة المرور غير صحيحة، حاول مرة أخرى.';
            }
        }

        initPage();
    </script>
</body>
</html>
