<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - صفحتك الخاصة</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        h2 { color: #00d2ff; margin-bottom: 15px; }
        p { color: #b2b2b2; margin-bottom: 20px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .btn:hover { opacity: 0.9; }
        .error { color: #ff6b6b; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h2>تسجيل الدخول</h2>
        <p>أدخل اسم المستخدم وكلمة المرور الخاصة بك</p>
        <input type="text" id="username-input" placeholder="اسم المستخدم">
        <input type="password" id="password-input" placeholder="كلمة المرور">
        <button class="btn" onclick="checkLogin()">دخول</button>
        <div id="error-msg" class="error"></div>
    </div>

    <script>
        async function checkLogin() {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            const errorDiv = document.getElementById('error-msg');

            if (!username || !password) {
                errorDiv.innerText = 'الرجاء إدخال الاسم وكلمة المرور.';
                return;
            }

            try {
                const res = await fetch('db.json');
                const data = await res.json();
                
                if (data[username] && data[username].password === password) {
                    const songUrl = data[username].song_link;
                    let html = `<h2>مرحباً بك، ${username}</h2><p>تم تسجيل الدخول بنجاح!</p>`;
                    
                    if (songUrl && songUrl.startsWith('http')) {
                        html += `<a href="${songUrl}" class="btn" target="_blank" style="margin-top: 20px; display:inline-block; text-align:center;">🎵 اضغط هنا لفتح الأغنية</a>`;
                    } else {
                        html += `<p style="color: #888;">لا توجد أغاني أو روابط مضافة لهذا الحساب حالياً.</p>`;
                    }
                    document.getElementById('app').innerHTML = html;
                } else {
                    errorDiv.innerText = 'اسم المستخدم أو كلمة المرور غير صحيحة.';
                }
            } catch (e) {
                errorDiv.innerText = 'تعذر الاتصال بقاعدة البيانات.';
            }
        }
    </script>
</body>
</html>
