<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة العميل الخاصة</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        h1 { color: #00d2ff; margin-bottom: 10px; font-size: 24px; }
        p { color: #b2b2b2; margin-bottom: 25px; font-size: 15px; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(0, 114, 255, 0.4);
            margin-top: 15px;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container" id="content">
        <p>جاري تحميل البيانات...</p>
    </div>

    <script>
        async function loadUserData() {
            const hash = window.location.hash.substring(1);
            const container = document.getElementById('content');
            
            if (!hash) {
                container.innerHTML = '<h2 class="error">عذراً</h2><p>لم يتم تحديد اسم المستخدم في الرابط.</p>';
                return;
            }

            try {
                const response = await fetch('db.json');
                const data = await response.json();
                
                if (data[hash]) {
                    const userInfo = data[hash];
                    let html = `<h1>أهلاً بك، ${hash}</h1>`;
                    html += `<p>مرحباً بك في صفحتك الخاصة المخصصة لك</p>`;
                    
                    const songLink = userInfo.song_link || userInfo.link;
                    if (songLink && songLink.startsWith('http')) {
                        html += `<a href="${songLink}" class="btn" target="_blank">🎵 اضغط هنا لفتح الأغنية أو الصفحة</a>`;
                    } else {
                        html += `<p style="color: #888;">لا توجد روابط أغاني مسجلة حالياً.</p>`;
                    }
                    
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<h2 class="error">غير موجود</h2><p>عذراً، هذا الحساب غير موجود.</p>';
                }
            } catch (e) {
                container.innerHTML = '<h2 class="error">خطأ في الاتصال</h2><p>تعذر جلب البيانات.</p>';
            }
        }
        loadUserData();
    </script>
</body>
</html>
