<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم السحابية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #070913; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="w-full max-w-lg mx-auto">

    <div class="glass-panel p-8 w-full space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-pink-400">لوحة التحكم السحابية</h1>
            <p class="text-xs text-gray-400 mt-1">إعدادات جيت هاب (تُحفظ مرة واحدة فقط)</p>
        </div>

        <!-- إعدادات جيت هاب -->
        <div class="bg-black/30 p-4 rounded-xl border border-white/10 space-y-3">
            <input type="text" id="gh-owner" placeholder="اسم المستخدم (مثال: mohamed-egypt7)" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-xs text-white">
            <input type="text" id="gh-repo" placeholder="اسم الريبو (مثال: For-you-)" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-xs text-white">
            <input type="password" id="gh-token" placeholder="GitHub Token" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-xs text-white">
            <button onclick="saveSettings()" class="w-full bg-pink-600/80 hover:bg-pink-600 text-white font-bold py-2 rounded-lg text-xs transition">حفظ الإعدادات في المتصفح</button>
        </div>

        <!-- نموذج إضافة صفحة جديدة -->
        <div class="space-y-4 pt-2">
            <div>
                <label class="block text-xs text-pink-300 font-semibold mb-1">معرف الرابط (Slug بالإنجليزية مثل: sara):</label>
                <input type="text" id="page-slug" placeholder="مثال: sara" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-pink-500 text-sm">
            </div>

            <div>
                <label class="block text-xs text-pink-300 font-semibold mb-1">اسم الشخص:</label>
                <input type="text" id="page-name" placeholder="مثال: سارة محمد" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-pink-500 text-sm">
            </div>

            <div>
                <label class="block text-xs text-pink-300 font-semibold mb-1">كلمة المرور:</label>
                <input type="text" id="page-pass" placeholder="كلمة السر لفتح الرسالة" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-pink-500 text-sm">
            </div>

            <div>
                <label class="block text-xs text-pink-300 font-semibold mb-1">نص الرسالة:</label>
                <textarea id="page-msg" rows="3" placeholder="اكتب الرسالة هنا..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-pink-500 text-sm resize-none"></textarea>
            </div>

            <div>
                <label class="block text-xs text-pink-300 font-semibold mb-1">رابط الأغنية (اختياري MP3):</label>
                <input type="text" id="page-song" placeholder="رابط مباشر للأغنية" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-pink-500 text-sm">
            </div>

            <button onclick="createNewPage()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm">
                إنشاء ورفع الصفحة على جيت هاب <i class="fas fa-cloud-upload-alt mr-2"></i>
            </button>
        </div>

        <div id="result-box" class="hidden space-y-2 pt-4 border-t border-white/10 text-center">
            <p class="text-xs text-green-400 font-semibold">تم رفع الصفحة وتحديث جيت هاب بنجاح!</p>
            <input type="text" id="final-link" readonly class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-pink-300 text-xs text-center select-all">
        </div>
    </div>

    <script>
        window.onload = function() {
            if(localStorage.getItem('gh_owner')) document.getElementById('gh-owner').value = localStorage.getItem('gh_owner');
            if(localStorage.getItem('gh_repo')) document.getElementById('gh-repo').value = localStorage.getItem('gh_repo');
            if(localStorage.getItem('gh_token')) document.getElementById('gh-token').value = localStorage.getItem('gh_token');
        };

        function saveSettings() {
            localStorage.setItem('gh_owner', document.getElementById('gh-owner').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
            alert("تم حفظ الإعدادات بنجاح!");
        }

        async function createNewPage() {
            const owner = localStorage.getItem('gh_owner') || document.getElementById('gh-owner').value.trim();
            const repo = localStorage.getItem('gh_repo') || document.getElementById('gh-repo').value.trim();
            const token = localStorage.getItem('gh_token') || document.getElementById('gh-token').value.trim();

            if (!owner || !repo || !token) {
                alert("يرجى إدخال وحفظ إعدادات جيت هاب أولاً بالأعلى.");
                return;
            }

            const slug = document.getElementById('page-slug').value.trim().toLowerCase();
            const name = document.getElementById('page-name').value.trim();
            const password = document.getElementById('page-pass').value.trim();
            const message = document.getElementById('page-msg').value.trim();
            const songUrl = document.getElementById('page-song').value.trim();

            if (!slug || !name || !password || !message) {
                alert("يرجى ملء الحقول الأساسية.");
                return;
            }

            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/db.json`;

            try {
                let fileSha = '';
                let dbData = {};

                const res = await fetch(apiUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (res.ok) {
                    const fileInfo = await res.json();
                    fileSha = fileInfo.sha;
                    const decodedContent = decodeURIComponent(escape(atob(fileInfo.content)));
                    dbData = JSON.parse(decodedContent);
                }

                dbData[slug] = { name, password, message, songUrl };

                const jsonString = JSON.stringify(dbData, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

                const updateRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Add new secret page for ${slug}`,
                        content: encodedContent,
                        sha: fileSha || undefined
                    })
                });

                if (updateRes.ok) {
                    const currentURL = window.location.href.replace('admin.html', 'index.html');
                    const fullLink = `${currentURL}?to=${slug}`;
                    document.getElementById('final-link').value = fullLink;
                    document.getElementById('result-box').classList.remove('hidden');
                    alert("تم إنشاء الصفحة ورفعها على جيت هاب بنجاح تام!");
                } else {
                    const errData = await updateRes.json();
                    alert("فشل الرفع لجيت هاب: " + (errData.message || "خطأ في الاتصال"));
                }
            } catch (e) {
                alert("حدث خطأ في الاتصال: " + e.message);
            }
        }
    </script>
</body>
</html>
