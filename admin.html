<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الرسائل الخاصة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #070913; color: white; min-height: 100vh; padding: 20px; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="max-w-3xl mx-auto space-y-8">

    <!-- 1. صندوق الوارد (الرسائل المستلمة) -->
    <div class="glass-panel p-6 sm:p-8 border border-pink-500/30">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-xl font-bold text-pink-400 flex items-center gap-2">
                <i class="fas fa-inbox"></i> صندوق الوارد (الردود والرسائل الواردة)
            </h1>
            <button onclick="clearInbox()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">
                <i class="fas fa-trash"></i> تفريغ صندوق الوارد
            </button>
        </div>
        <div id="inbox-list" class="space-y-4">
            <p class="text-gray-400 text-sm text-center py-4">لا توجد رسائل واردة حتى الآن.</p>
        </div>
    </div>

    <!-- 2. صانع الصفحات -->
    <div class="glass-panel p-6 sm:p-8">
        <h2 class="text-xl font-bold text-pink-400 mb-6 flex items-center gap-2">
            <i class="fas fa-tools"></i> صانع صفحات الرسائل (المنفذ 9090)
        </h2>

        <div class="space-y-4 text-right">
            <div>
                <label class="block text-xs text-gray-300 font-semibold mb-1">معرف الرابط (Slug) بالإنجليزية بدون مسافات (مثال: mohamed):</label>
                <input type="text" id="page-slug" placeholder="mok" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 font-mono">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-300 font-semibold mb-1">اسم الشخص الموجه له الرسالة:</label>
                    <input type="text" id="page-name" placeholder="محمد ياسر" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 font-semibold mb-1">كلمة مرور فتح الصفحة:</label>
                    <input type="text" id="page-password" placeholder="123" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 font-mono">
                </div>
            </div>

            <div>
                <label class="block text-xs text-gray-300 font-semibold mb-1">رابط صورة شخصية تحت الاسم (اختياري تماماً):</label>
                <input type="text" id="page-image" placeholder="https://files.catbox.moe/image.jpg" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 font-mono">
            </div>

            <div>
                <label class="block text-xs text-gray-300 font-semibold mb-1">نص الرسالة السرية:</label>
                <textarea id="page-message" rows="4" placeholder="اكتب رسالتك هنا..." class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 resize-none"></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-300 font-semibold mb-1">رابط الأغنية المباشر (.mp3):</label>
                    <input type="text" id="page-song-url" placeholder="https://files.catbox.moe/song.mp3" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs text-gray-300 font-semibold mb-1">عنوان الأغنية الظاهر:</label>
                    <input type="text" id="page-song-title" placeholder="مقطوعة هادئة" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-pink-500">
                </div>
            </div>

            <button onclick="savePageData()" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold py-4 rounded-xl transition shadow-lg text-sm mt-4">
                <i class="fas fa-save ml-2"></i> حفظ الصفحة وإنشاء الرابط
            </button>
        </div>
    </div>

    <!-- 3. الصفحات المحفوظة -->
    <div class="glass-panel p-6">
        <h2 class="text-lg font-bold text-pink-400 mb-4">الصفحات المحفوظة حالياً:</h2>
        <div id="pages-list" class="space-y-3 text-sm"></div>
    </div>

    <script>
        function savePageData() {
            const slug = document.getElementById('page-slug').value.trim().toLowerCase();
            const name = document.getElementById('page-name').value.trim();
            const password = document.getElementById('page-password').value.trim();
            const imageUrl = document.getElementById('page-image').value.trim();
            const message = document.getElementById('page-message').value.trim();
            const songUrl = document.getElementById('page-song-url').value.trim();
            const songTitle = document.getElementById('page-song-title').value.trim();

            if (!slug || !name || !password || !message) {
                alert("يرجى ملء الحقول الأساسية.");
                return;
            }

            let db = JSON.parse(localStorage.getItem('secret_pages_db')) || {};

            db[slug] = {
                name: name,
                password: password,
                imageUrl: imageUrl,
                message: message,
                songUrl: songUrl || "https://actions.google.com/sounds/v1/ambiences/relaxing_music.ogg",
                songTitle: songTitle || "مقطوعة هادئة",
                songDesc: "موسيقى مخصصة للرسالة"
            };

            localStorage.setItem('secret_pages_db', JSON.stringify(db));
            alert("تم حفظ الصفحة بنجاح! الرابط الفعال: ?to=" + slug);
            loadPagesList();
        }

        function loadPagesList() {
            let db = JSON.parse(localStorage.getItem('secret_pages_db')) || {};
            const listContainer = document.getElementById('pages-list');
            listContainer.innerHTML = '';

            for (let slug in db) {
                const item = document.createElement('div');
                item.className = "bg-white/5 p-3 rounded-xl flex items-center justify-between border border-white/5";
                item.innerHTML = `
                    <div>
                        <p class="font-bold text-pink-300">الاسم: ${db[slug].name}</p>
                        <p class="text-xs text-gray-400 font-mono">الرابط: ?to=${slug} | الباسورد: ${db[slug].password}</p>
                    </div>
                    <a href="index.html?to=${slug}" target="_blank" class="bg-pink-600/30 text-pink-300 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-pink-600 hover:text-white transition">معاينة</a>
                `;
                listContainer.appendChild(item);
            }
        }

        function loadInbox() {
            let inbox = JSON.parse(localStorage.getItem('secret_inbox_messages')) || [];
            const inboxContainer = document.getElementById('inbox-list');
            inboxContainer.innerHTML = '';

            if (inbox.length === 0) {
                inboxContainer.innerHTML = '<p class="text-gray-400 text-sm text-center py-4">لا توجد رسائل واردة حتى الآن.</p>';
                return;
            }

            inbox.forEach((msg, index) => {
                const card = document.createElement('div');
                card.className = "bg-white/5 p-4 rounded-2xl border border-white/10 space-y-2 text-sm";
                card.innerHTML = `
                    <div class="flex items-center justify-between text-xs text-gray-400 border-b border-white/5 pb-2">
                        <span><i class="fas fa-tag text-pink-400"></i> صفحة: <strong class="text-white">${msg.recipientName}</strong> (${msg.slug})</span>
                        <span><i class="far fa-clock"></i> ${msg.date}</span>
                    </div>
                    <p class="text-gray-200 font-medium bg-black/20 p-3 rounded-xl border border-white/5">${msg.text}</p>
                    <div class="flex items-center justify-between text-xs text-gray-400 pt-1">
                        <span><i class="fas fa-globe text-purple-400"></i> الآي بي: <span class="font-mono text-white">${msg.ip}</span> | الموقع: <span class="text-white">${msg.location}</span></span>
                        <button onclick="deleteSingleMessage(${msg.id})" class="text-red-400 hover:text-red-300 font-semibold"><i class="fas fa-trash-alt"></i> حذف</button>
                    </div>
                `;
                inboxContainer.appendChild(card);
            });
        }

        function deleteSingleMessage(id) {
            let inbox = JSON.parse(localStorage.getItem('secret_inbox_messages')) || [];
            inbox = inbox.filter(m => m.id !== id);
            localStorage.setItem('secret_inbox_messages', JSON.stringify(inbox));
            loadInbox();
        }

        function clearInbox() {
            if (confirm("هل أنت متأكد من تفريغ كل الرسائل الواردة؟")) {
                localStorage.removeItem('secret_inbox_messages');
                loadInbox();
            }
        }

        window.onload = function() {
            loadPagesList();
            loadInbox();
        };
    </script>
</body>
</html>
